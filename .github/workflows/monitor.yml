name: Alta Via 1 rifugio monitor

on:

  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: av1-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py ${{ inputs.test_alert && '--test-alert' || '' }}
      - name: Save state and STATUS.md
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name "av1-monitor"
          git config user.email "av1-monitor@users.noreply.github.com"
          mkdir -p state
          git add state STATUS.md
          git diff --cached --quiet || git commit -m "monitor run $(date -u +%FT%H:%MZ)"
          git push
